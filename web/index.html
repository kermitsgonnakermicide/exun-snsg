<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RECKONING ANOMALY ASSESSMENT SYSTEM</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #0b0d0b; color: #c8d0b8; font: 15px/1.45 "JetBrains Mono", "DejaVu Sans Mono", monospace; display: flex; flex-direction: column; letter-spacing: 0.02em; }
  .panel { border: 3px solid #5d6b4a; position: relative; }
  .panel > .title { position: absolute; top: -0.8em; left: 1ch; background: #0b0d0b; color: #a8a23a; padding: 0 0.5ch; }
  .banner { background: #a8a23a; color: #0b0d0b; font-weight: bold; text-align: center; }
  #header { color: #a8a23a; padding: 0.2em 1ch; margin: 0.2em 0.3ch; white-space: pre; }
  #body { flex: 1; display: flex; min-height: 0; gap: 0.6ch; margin: 0.4em 0.3ch; }
  #controls { width: 40ch; padding: 0.6em 1ch; display: flex; flex-direction: column; }
  #controls input { font: inherit; color: #c8d0b8; background: #141814; border: 0; border-left: 3px solid #3a4430; border-right: 3px solid #3a4430; outline: 0; padding: 0.7em 2ch; margin-bottom: 1.4em; width: 100%; }
  #controls input:focus { border-color: #a8a23a; }
  .field { display: flex; margin-bottom: 1.4em; }
  .field input { margin-bottom: 0 !important; min-width: 0; }
  .field button { margin: 0 !important; padding: 0 1ch !important; }
  #controls button { font: inherit; font-weight: bold; color: #c8d0b8; background: #2a3322; border: 0; padding: 0; margin-bottom: 1.4em; cursor: pointer; letter-spacing: inherit; }
  #controls button:hover { background: #5d6b4a; }
  #controls button:disabled { opacity: 0.5; cursor: default; }
  #complete { background: #6b2a1e !important; }
  #status { color: #a8a23a; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; padding-top: 0.6em; }
  table { border-collapse: collapse; width: 100%; height: 7.2em; display: block; overflow: auto; margin-top: 0.3em; }
  th, td { text-align: left; padding: 0 2ch 0 0; white-space: nowrap; }
  thead { background: #1b2015; font-weight: bold; }
  thead th:last-child, tbody td:last-child { width: 100%; }
  tbody tr:nth-child(even) { background: #10130f; }
  tbody tr:first-child { background: #0d2a4a; }
  #dossier { flex: 1; border-top: 3px solid #3a4430; padding: 0.6em 1ch; white-space: pre; overflow: auto; }
  .alert { color: #c0503a; font-weight: bold; }
  .label { color: #a8a23a; }
  .dim { color: #5d6b4a; }
  #logpanel { height: 9em; margin: 0.4em 0.3ch; padding: 0.6em 0.5ch 0.3em; background: #080908; display: flex; }
  #log { flex: 1; overflow-y: auto; }
  #log div { white-space: pre-wrap; }
  footer { background: #141814; padding: 0 1ch; display: flex; gap: 2ch; }
  footer b { color: #e8a33a; }
</style>
</head>
<body>
<div class="banner">AUTHORISED // OFFICIAL USE ONLY</div>
<div id="header" class="panel"> (C)2026 Isengard Systems • Consult debrief for usage instructions •  </div>
<div id="body">
  <div id="controls" class="panel">
    <span class="title">TASKING</span>
    <div>REFERENCE BINARY</div><div class="field"><input id="original" spellcheck="false"><button data-for="original">BROWSE</button></div>
    <div>SUSPECT BINARY</div><div class="field"><input id="altered" spellcheck="false"><button data-for="altered">BROWSE</button></div>
    <div>GHIDRA CLI</div><input id="ghidra" spellcheck="false">
    <button id="scan">F5 · SCAN</button>
    <button id="complete">F9 · COMPLETE ANALYSIS</button>
    <div id="status">STATUS: STANDBY</div>
  </div>
  <div id="main" class="panel">
    <span class="title">DIFFERENTIAL RESULTS</span>
    <table><thead><tr><th>CLASS</th><th>ALTERED</th><th>TOTAL</th><th>DEVIATION</th></tr></thead><tbody id="ranking"></tbody></table>
    <div id="dossier">Awaiting Analysis</div>
  </div>
</div>
<input type="file" id="picker" hidden>
<div id="logpanel" class="panel"><span class="title">OPERATIONS LOG</span><div id="log"></div></div>
<footer><span><b>F5</b> Scan</span><span><b>F9</b> Complete analysis</span></footer>
<script>
const $ = (id) => document.getElementById(id);
const escape = (text) => String(text).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

function logLine(html) {
  const line = document.createElement("div");
  line.innerHTML = `<span class="dim">${new Date().toTimeString().slice(0, 8)} </span>${html}`;
  $("log").append(line);
  $("log").scrollTop = $("log").scrollHeight;
}

function setBusy(busy) {
  $("scan").disabled = $("complete").disabled = busy;
  $("status").textContent = busy ? "STATUS: PROCESSING" : "STATUS: STANDBY";
}

function show(report) {
  $("ranking").innerHTML = report.ranking.map((entry) =>
    `<tr><td>${escape(entry.class)}</td><td>${entry.changed}</td><td>${entry.total}</td><td>${Math.round(entry.ratio * 100)}%</td></tr>`).join("");
  const missing = report.missing;
  if (!missing) {
    $("dossier").textContent = "NO DEVIATION DETECTED. BUILDS MATCH.";
    return logLine("No missing or changed classes.");
  }
  const attributes = missing.properties.map((field) =>
    `  +0x${field.offset.toString(16).toUpperCase().padStart(2, "0")}  ${field.kind.toUpperCase().padEnd(10)} ${escape(field.value)}`);
  $("dossier").innerHTML = [
    `<span class="alert">SUBJECT MISSING: ${escape(missing.class.toUpperCase())} </span>`,
    `<span class="alert"> UPLOAD AND FOLLOW INCIDENT RESPONSE PROCEDURE 92 IMMEDIATELY</span>`, "",
    `<span class="label">RECOVERED ATTRIBUTES</span>`, ...attributes, "",
    `<span class="label">MISSING METHODS</span>`, ...Object.keys(missing.methods).map((signature) => "  " + escape(signature)),
  ].join("\n");
  logLine(`<span class="alert" style="font-weight:normal">ALERT: </span>class ${escape(missing.class)} absent from suspect build.`);
}

function download(report) {
  const now = new Date();
  const pad = (value) => String(value).padStart(2, "0");
  const stamp = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([JSON.stringify(report, null, 2)], { type: "application/json" }));
  link.download = `analysis-${stamp}.json`;
  link.click();
  logLine(`Findings outputted: <b>${link.download}</b>`);
}

async function runAnalysis(exportReport) {
  if ($("scan").disabled) return;
  const paths = Object.fromEntries(["original", "altered", "ghidra"].map((key) => [key, $(key).value]));
  setBusy(true);
  logLine(`Beginning analysis of ${escape(paths.original.split("/").pop())} and ${escape(paths.altered.split("/").pop())}. This process will take time.`);
  try {
    const response = await fetch("/api/analyze", { method: "POST", body: JSON.stringify(paths) });
    const report = await response.json();
    if (!response.ok) throw new Error(report.error);
    show(report);
    if (exportReport) download(report);
  } catch (error) {
    logLine(`<span class="alert" style="font-weight:normal">FAULT: </span>${escape(error.message)}`);
  }
  setBusy(false);
}

$("scan").onclick = () => runAnalysis(false);
$("complete").onclick = () => runAnalysis(true);

let pickerTarget;
document.querySelectorAll("[data-for]").forEach((button) => button.onclick = () => {
  pickerTarget = button.dataset.for;
  $("picker").value = "";
  $("picker").click();
});
$("picker").onchange = async () => {
  const file = $("picker").files[0];
  if (!file) return;
  logLine(`Uploading ${escape(file.name)}.`);
  const response = await fetch(`/api/upload?name=${encodeURIComponent(file.name)}`, { method: "POST", body: file });
  $(pickerTarget).value = (await response.json()).path;
  logLine(`${escape(file.name)} loaded as ${pickerTarget === "original" ? "reference" : "suspect"} binary.`);
};

document.addEventListener("keydown", (event) => {
  if (event.key === "F5" || event.key === "F9") {
    event.preventDefault();
    runAnalysis(event.key === "F9");
  }
});
fetch("/api/defaults").then((response) => response.json()).then((defaults) => {
  for (const key in defaults) $(key).value = defaults[key];
  logLine("Succesful boot.");
});
</script>
</body>
</html>
